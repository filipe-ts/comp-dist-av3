[project]
name = "python-server"
version = "0.1.0"
description = "python rest and graphql server"
authors = [
    {name = "filipe-ts",email = "filipets@live.com"}
]
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "fastapi (>=0.121.2,<0.122.0)",
    "pydantic (>=2.12.4,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "psycopg[binary] (>=3.2.12,<4.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "strawberry-graphql (>=0.285.0,<0.286.0)",
    "strawberry-graphql[fastapi] (>=0.285.0,<0.286.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "anyio (>=4.11.0,<5.0.0)",
    "spyne (>=2.14.0,<3.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "defusedxml (>=0.7.1,<0.8.0)",
    "punq (>=0.7.0,<0.8.0)",
    "psycopg-pool (>=3.2.7,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^25.11.0"
mypy = "^1.18.2"
isort = "^7.0.0"
autoflake = "^2.3.1"
flake8 = "^7.3.0"
flake8-pyproject = "^1.2.3"

[tool.black]
line-length = 88
target-version = ["py39"]
include = '\.pyi?$'
exclude = '''
/(
    \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["adapters", "application", "config", "domain"]
skip = [".venv", "build", "dist"]

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",  # space before ':', conflicts with black
    "W503",  # line break before binary operator, conflicts with black
]
exclude = [
    ".venv",
    ".venv/*",
    "build",
    "build/*",
    "dist",
    "dist/*",
]
max-complexity = 10

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = true
exclude = [
    "^\\.venv/",
    "^build/",
    "^dist/",
]
mypy_path = ["."]
# You can pin the main packages if you like:
# packages = ["adapters", "application", "config", "domain"]

[tool.autoflake]
remove-all-unused-imports = true
remove-unused-variables = true
expand-star-imports = true
ignore-init-module-imports = true
in-place = true
recursive = true
exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.poetry.scripts]
lint = "python_server_tools:lint"
format = "python_server_tools:format"